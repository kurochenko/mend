# Improvement miner: periodically clusters confirmed review findings into typed
# improvement proposals (tooling / instructions / process). Global execution over
# all configured projects; proposals are surfaced in the /improvements dashboard
# and the `bun run improvements` CLI. Never posts to MRs.
