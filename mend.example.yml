projects:
  backend:
    platform: gitlab
    url: https://gitlab.com
    token: ${BACKEND_GITLAB_TOKEN}
    webhook_signing_token: ${BACKEND_WEBHOOK_SIGNING_TOKEN}
    # webhook_secret: ${BACKEND_WEBHOOK_SECRET}  # only needed without a signing token
    project_id: 123
    repo_url: git@gitlab.com:org/backend.git
    default_branch: main
    trigger:
      mode: ready # ready (skips drafts) or all; label is not implemented yet
    tools:
      context7:
        # api_key: ${CONTEXT7_API_KEY}
    review:
      llm:
        model: openai-codex/gpt-6-luna
        thinking_level: medium
      # agent:
      #   harness: pi # pi, codex, opencode, or ensemble
      #   model: openai-codex/gpt-6-luna # pi needs provider/model
      #   thinking_level: medium
      #   timeout_ms: 1200000
      #   ensemble:
      #     finder_harness: codex
      #     finder_model: gpt-5.5
      #     finder_thinking_level: low
      #     finder_timeout_ms: 300000
      #     verify_enabled: true
      #     verifier_model: gpt-5.5
      #     verifier_thinking_level: low
      #     verifier_timeout_ms: 180000
      #     deep_samples: 2
      #     deep_model: gpt-5.5
      #     deep_timeout_ms: 1200000
      #     synthesizer_model: gpt-5.5
      #     synthesizer_timeout_ms: 300000
      flags:
        structured_findings_post: true
        structural_signals: true
        bug_history: true
        # dry_run: false
      # memory:
      #   project_scope_usernames:
      #     - your-gitlab-username
      # comparison:
      #   enabled: false
      #   harness: opencode # pi, codex, opencode, or ensemble
      #   model: openai/gpt-6-luna
      #   thinking_level: medium
      #   timeout_ms: 300000

